[project]
name = "kbr-eda"
version = "0.1.0"
description = "EDA danych KBR Wrocław na potrzeby cyfrowego bliźniaka sieci drogowej"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "openpyxl>=3.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "matplotlib>=3.8",
    "contextily>=1.6",
    "folium>=0.17",
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
dev = ["pre-commit>=3.7", "ruff>=0.5", "nbstripout>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
