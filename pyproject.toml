[project]
name = "wroclaw-twin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "osmium>=4.3.2",
    "pandas>=3.1.0",
    "pymetis>=2025.2.2",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
# Minimal environment of the pilot raters: submit_edits.sh and check_setup.sh (no pymetis, geopandas, ...).
pilot = [
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
]
